<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Student Register</h1>
    <p id="summary" aria-live="polite">0 students</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add student</h2>
      <div id="form" class="form">
        <input type="hidden" id="studentId">
        <label>Name <input id="name" type="text" autocomplete="off"></label>
        <label>Email <input id="email" type="email" autocomplete="off"></label>
        <label>Course <input id="course" type="text" autocomplete="off"></label>
        <label>Grade (0–100) <input id="grade" type="number" min="0" max="100"></label>
        <p id="error" class="error" role="alert"></p>
        <div class="row">
          <button id="saveBtn" type="button">Add student</button>
          <button id="cancelBtn" type="button" class="ghost" hidden>Cancel</button>
        </div>
      </div>
    </section>

    <section class="panel wide" aria-labelledby="list-title">
      <div class="row between">
        <h2 id="list-title">Students</h2>
        <input id="search" type="search" placeholder="Search name, email or course" aria-label="Search students">
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Course</th><th>Grade</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No students yet. Fill in the form to add the first one.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
